          element_phi_3db: 120                      # Horizontal 3dB beamwidth [deg]
          element_theta_3db: 120                    # Vertical 3dB beamwidth [deg]
          n_rows: 28                                # Rows in the array
          n_columns: 28                             # Columns in the array
          element_horiz_spacing: 0.5                # Horizontal spacing [in wavelengths]
          element_vert_spacing: 0.5                 # Vertical spacing [in wavelengths]
          element_am: 30                            # Front-to-back ratio [dB]
          element_sla_v: 30                         # Vertical sidelobe attenuation [dB]
          multiplication_factor: 12                 # Pattern scaling factor
    sat_is_active_if:
