#### MSS Parameters @7.3GHz
# Single Earth Station representing an MSS Earth Station in the 2.1GHz band.

id: arns.962MHz.radar

metadata:
  referenced_documents:
  #  - Parameters based on Document 4C/356-E - 6 May 2025

single_earth_station:
  frequency: 962  # MHz - center frequency of the forward link at the edge of the band
  bandwidth: 3.5  # MHz
  tx_power_density: 0  # dBW/Hz - no info - system description only for receiver
  noise_temperature: 170  #  (F -1)xTo, To = 290k, F = 4 dB, (10ˆ0,4 - 1)* 290
  adjacent_ch_selectivity: 20.0  # dB
  polarization_loss: 0  #


  geometry:
    height: 10000
    azimuth:
      type: UNIFORM_DIST
      uniform_dist:
        min: -180
        max: 180
    elevation:
      type: UNIFORM_DIST
      uniform_dist:
        min: 10  # minimum elevation for 7.1.4 forward system R communication
        max: 90
    location:
      type: FIXED
      fixed:  # positioned at the reference point
        x: 0.0
        y: 0.0

  antenna:
    pattern: OMNI  # Custom pattern for Hibleo-X MSS UE #https://www.itu.int/dms_pubrec/itu-r/rec/m/R-REC-M.1091-0-199409-I!!PDF-E.pdf 
    gain: 5.4 # Gain calculated by G/T = -18 dBi defined in document table 4B
    
