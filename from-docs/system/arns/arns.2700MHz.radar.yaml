id: arns.2700MHz.radar

metadata:
  referenced_documents:
   - Parameters based on Document ITU-R M.1464-2, Table 1, Radar A

single_earth_station:
  frequency: 2703  # MHz - center frequency of the forward link at the edge of the band
  bandwidth: 6.0  # MHz
  tx_power_density: 0  # dBW/Hz - no info - system description only for receiver
  noise_temperature: 438  #  (F -1)xTo, To = 290k, F = 4 dB, (10ˆ0,4 - 1)* 290
  adjacent_ch_selectivity: null  # NOTE: no info on doc
  polarization_loss: 0


  geometry:
    height: 8
    azimuth:
      type: UNIFORM_DIST
      uniform_dist:
        min: -180
        max: 180
    elevation:
      type: UNIFORM_DIST
      uniform_dist:
        min: 10  # minimum elevation for 7.1.4 forward system R communication
        max: 90
    location:
      type: FIXED
      fixed:  # positioned at the reference point
        x: 0.0
        y: 0.0

  antenna:
    # TODO: csc^2+30
    # elev_beamwidth = 4.8
    # azim_beamwidth = 1.3
    pattern: CSC^2
    csc_2:
      elevation_beamwidth_3db: 4.8
      azim_beamwidth_3db: 1.35
      theta_end: 30.0
      floor_gain_db: -55.0
    gain: 33.5
