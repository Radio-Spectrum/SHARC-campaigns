id: arns.964MHz.ldacs

metadata:
  referenced_documents:
   - Parameters based on R23-WP4C-C-0216!!MSW-E

single_earth_station:
  frequency: 964.25  # MHz - center frequency of the forward link at the edge of the band
  bandwidth: 0.5  # MHz
  tx_power_density: 0  # dBW/Hz - no info - system description only for receiver
  noise_temperature: 1154.5  #  (F)xTo, To = 290k, F = 6 dB, (10ˆ0,6)* 290
  # ACS @ freq. offset (MHz)
  # 0 @ 0.25
  # 6 @ 0.3
  # 40 @ 0.4
  # 70 @ 0.5
  # 80 @ 0.75
  # 90 @ 1.5
  adjacent_ch_selectivity: null  # dB
  polarization_loss: 0  #


  geometry:
    height: 10
    azimuth:
      type: UNIFORM_DIST
      uniform_dist:
        min: -180
        max: 180
    elevation:
      type: UNIFORM_DIST
      uniform_dist:
        min: 10  # minimum elevation for 7.1.4 forward system R communication
        max: 90
    location:
      type: FIXED
      fixed:  # positioned at the reference point
        x: 0.0
        y: 0.0

  antenna:
    pattern: OMNI  # Custom pattern for Hibleo-X MSS UE #https://www.itu.int/dms_pubrec/itu-r/rec/m/R-REC-M.1091-0-199409-I!!PDF-E.pdf 
    gain: 12 # Gain calculated by G/T = -18 dBi defined in document table 4B
    
